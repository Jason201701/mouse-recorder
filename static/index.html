<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Recorder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 720px; }
h1 { font-size: 1.3em; margin-bottom: 16px; color: #cba6f7; }
.card { background: #313244; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 0.9em; color: #a6adc8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #45475a; }
th { color: #a6adc8; font-weight: 600; }
tr:hover { background: #45475a; cursor: pointer; }
tr.selected { background: #585b70; }
.row-actions { display: flex; gap: 6px; margin-top: 8px; }
.row-actions button { font-size: 0.75em; }
button { background: #585b70; color: #cdd6f4; border: none; border-radius: 6px; padding: 7px 14px; font-size: 0.85em; cursor: pointer; transition: background 0.15s; }
button:hover { background: #6c7086; }
button.primary { background: #cba6f7; color: #1e1e2e; font-weight: 600; }
button.primary:hover { background: #b4befe; }
button.danger { background: #f38ba8; color: #1e1e2e; }
button.danger:hover { background: #eba0ac; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85em; }
.settings-grid label { color: #a6adc8; }
.settings-grid .val { color: #cdd6f4; }
select, input[type=number], input[type=text] { background: #45475a; color: #cdd6f4; border: 1px solid #585b70; border-radius: 6px; padding: 5px 8px; font-size: 0.85em; }
.status { font-size: 0.8em; color: #a6adc8; padding: 4px 0; }
.status.recording { color: #f38ba8; }
.status.playing { color: #a6e3a1; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal { background: #313244; border-radius: 12px; padding: 20px; min-width: 320px; }
.modal h3 { margin-bottom: 12px; color: #cba6f7; }
.modal p { margin: 4px 0; color: #a6adc8; font-size: 0.85em; }
.modal .hotkey-keys { display: flex; gap: 6px; margin: 10px 0; }
.modal .hotkey-keys span { background: #45475a; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; }
.modal .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
.badge { display: inline-block; background: #45475a; padding: 2px 8px; border-radius: 4px; font-size: 0.75em; }
</style>
</head>
<body>
<div class="container">
  <h1>🎯 Mouse Recorder</h1>

  <!-- 录制列表 -->
  <div class="card">
    <h2>📋 录制列表</h2>
    <table><thead><tr><th>名称</th><th>模式</th><th>事件数</th><th>时长</th></tr></thead><tbody id="rec-list"></tbody></table>
    <div class="row-actions">
      <button onclick="deleteSelected()">删除</button>
      <button onclick="renameSelected()">重命名</button>
      <button onclick="showTrimModal()">裁剪头尾</button>
    </div>
  </div>

  <!-- 控制 -->
  <div class="card">
    <h2>🎮 控制</h2>
    <div class="controls">
      <button class="primary" id="btn-record" onclick="toggleRecord()">▶ 开始录制</button>
      <button class="primary" id="btn-play" onclick="playSelected()">▶ 回放选中</button>
      <button class="danger" id="btn-stop" onclick="stopPlay()" disabled>⏹ 停止回放</button>
    </div>
    <div style="margin-top:10px;font-size:0.8em;">
      <span style="color:#a6adc8;">提示：也可使用全局热键操控（Ctrl+Shift+F9 录制 / Ctrl+Shift+F10 回放）</span>
    </div>
  </div>

  <!-- 设置 -->
  <div class="card">
    <h2>⚙️ 设置</h2>
    <div class="settings-grid">
      <label>录制模式</label>
      <select id="cfg-mode" onchange="saveConfig()">
        <option value="absolute">绝对坐标</option>
        <option value="relative">窗口相对</option>
      </select>
      <label>回放速度</label>
      <select id="cfg-speed" onchange="saveConfig()">
        <option value="0.5">0.5x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="2.0">2.0x</option>
        <option value="5.0">5.0x</option>
      </select>
      <label>循环次数</label>
      <div>
        <input type="number" id="cfg-loops" value="1" min="1" style="width:70px" onchange="saveConfig()">
        <label style="margin-left:10px"><input type="checkbox" id="cfg-infinite" onchange="toggleInfiniteLoop()"> 无限循环</label>
      </div>
    </div>
    <div class="settings-grid" style="margin-top:10px">
      <label>录制热键</label><span class="val" id="cfg-hk-record">Ctrl+Shift+F9</span>
      <label>回放热键</label><span class="val" id="cfg-hk-play">Ctrl+Shift+F10</span>
    </div>
    <div style="margin-top:8px">
      <button onclick="showHotkeyModal('record')">修改录制热键</button>
      <button onclick="showHotkeyModal('play')" style="margin-left:6px">修改回放热键</button>
    </div>
  </div>

  <!-- 状态 -->
  <div class="status" id="status">就绪</div>
</div>

<!-- 热键捕获弹窗 -->
<div class="modal-overlay" id="hk-modal">
  <div class="modal">
    <h3 id="hk-modal-title">按下新热键...</h3>
    <p>请按下键盘组合键（如 Ctrl+Shift+K），完成后释放所有按键即可。</p>
    <div class="hotkey-keys" id="hk-keys"><span style="color:#a6adc8">等待按键...</span></div>
    <div class="modal-actions">
      <button class="danger" onclick="cancelHotkey()">取消</button>
    </div>
  </div>
</div>

<!-- 裁剪弹窗 -->
<div class="modal-overlay" id="trim-modal">
  <div class="modal">
    <h3>裁剪录制</h3>
    <p>保留时间段（毫秒）：</p>
    <div style="display:flex;gap:10px;margin:10px 0">
      <label>起始: <input type="number" id="trim-start" value="0" style="width:100px"></label>
      <label>结束: <input type="number" id="trim-end" placeholder="留空=末尾" style="width:100px"></label>
    </div>
    <div class="modal-actions">
      <button onclick="cancelTrim()">取消</button>
      <button class="primary" onclick="doTrim()">确定</button>
    </div>
  </div>
</div>

<script>
let selId = null;
let hkTarget = null;
let pressedKeys = new Set();

async function api(path, method='GET', body=null) {
  let opts = { method };
  if (body) { opts.headers = {'Content-Type': 'application/json'}; opts.body = JSON.stringify(body); }
  let r = await fetch(path, opts);
  return r.json();
}

async function refreshList() {
  let data = await api('/api/recordings');
  let tbody = document.getElementById('rec-list');
  tbody.innerHTML = '';
  data.forEach(r => {
    let tr = document.createElement('tr');
    if (r.id === selId) tr.classList.add('selected');
    tr.innerHTML = `<td>${r.name}</td><td>${r.mode === 'absolute' ? '绝对坐标' : '窗口相对'}</td><td>${r.event_count}</td><td>${(r.duration_ms/1000).toFixed(1)}s</td>`;
    tr.onclick = () => { selId = r.id; refreshList(); };
    tbody.appendChild(tr);
  });
}

async function toggleRecord() {
  let status = await api('/api/status');
  if (status.recording) {
    await api('/api/record/stop', 'POST');
    document.getElementById('btn-record').textContent = '▶ 开始录制';
  } else {
    let mode = document.getElementById('cfg-mode').value;
    await api('/api/record/start', 'POST', {mode});
    document.getElementById('btn-record').textContent = '⏹ 停止录制';
  }
  refreshList();
  refreshStatus();
}

async function playSelected() {
  if (!selId) return alert('请先选择一个录制');
  let speed = parseFloat(document.getElementById('cfg-speed').value) || 1.0;
  let loops = document.getElementById('cfg-infinite').checked ? 0 : (parseInt(document.getElementById('cfg-loops').value) || 1);
  await api('/api/play', 'POST', {id: selId, speed, loops});
  document.getElementById('btn-play').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-record').disabled = true;
  refreshStatus();
}

async function stopPlay() {
  await api('/api/play/stop', 'POST');
  document.getElementById('btn-play').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-record').disabled = false;
  refreshStatus();
}

async function deleteSelected() {
  if (!selId) return;
  if (!confirm('确定要删除吗？')) return;
  await api('/api/recording/delete', 'POST', {id: selId});
  selId = null;
  refreshList();
}

async function renameSelected() {
  if (!selId) return;
  let name = prompt('新名称:');
  if (!name) return;
  await api('/api/recording/rename', 'POST', {id: selId, name});
  refreshList();
}

function showTrimModal() {
  if (!selId) return;
  document.getElementById('trim-modal').classList.add('show');
}

async function doTrim() {
  let start = parseInt(document.getElementById('trim-start').value) || 0;
  let endVal = document.getElementById('trim-end').value;
  let end = endVal ? parseInt(endVal) : null;
  await api('/api/recording/trim', 'POST', {id: selId, start_ms: start, end_ms: end});
  cancelTrim();
  refreshList();
}

function cancelTrim() {
  document.getElementById('trim-modal').classList.remove('show');
}

// ---- 热键捕获 ----
function showHotkeyModal(target) {
  hkTarget = target;
  pressedKeys = new Set();
  document.getElementById('hk-modal').classList.add('show');
  document.getElementById('hk-modal-title').textContent = target === 'record' ? '修改录制热键' : '修改回放热键';
  document.getElementById('hk-keys').innerHTML = '<span style="color:#a6adc8">按下组合键...</span>';
}

function cancelHotkey() {
  document.getElementById('hk-modal').classList.remove('show');
  hkTarget = null;
  pressedKeys = new Set();
}

document.addEventListener('keydown', e => {
  if (!hkTarget) return;
  e.preventDefault();
  let k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) {
    k = e.key.toLowerCase().replace('control', 'ctrl');
  }
  pressedKeys.add(k);
  let display = Array.from(pressedKeys).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('+');
  document.getElementById('hk-keys').innerHTML = Array.from(pressedKeys).map(s => `<span>${s.charAt(0).toUpperCase() + s.slice(1)}</span>`).join('<span style="color:#a6adc8;padding:0 4px">+</span>');
});

document.addEventListener('keyup', async e => {
  if (!hkTarget || pressedKeys.size === 0) return;
  // 等一小段时间，如果用户还在按键则继续等待
  setTimeout(async () => {
    if (!hkTarget) return;
    let keys = Array.from(pressedKeys);
    let display = keys.map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('+');
    // 保存
    let key = hkTarget === 'record' ? 'hotkey_record' : 'hotkey_play';
    await api('/api/config', 'POST', {[key]: keys});
    document.getElementById(hkTarget === 'record' ? 'cfg-hk-record' : 'cfg-hk-play').textContent = display;
    cancelHotkey();
  }, 300);
});

// ---- 配置 & 状态轮询 ----
let lastStatus = '';
async function refreshStatus() {
  try {
    let s = await api('/api/status');
    let el = document.getElementById('status');
    if (s.recording) {
      el.textContent = '🔴 录制中...';
      el.className = 'status recording';
      document.getElementById('btn-record').textContent = '⏹ 停止录制';
    } else if (s.playing) {
      el.textContent = '🟢 回放中...';
      el.className = 'status playing';
      document.getElementById('btn-play').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      document.getElementById('btn-record').disabled = true;
    } else {
      el.textContent = '就绪';
      el.className = 'status';
      document.getElementById('btn-record').textContent = '▶ 开始录制';
      document.getElementById('btn-play').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('btn-record').disabled = false;
    }
    if (JSON.stringify(s) !== lastStatus) { lastStatus = JSON.stringify(s); refreshList(); }
  } catch(e) {}
  setTimeout(refreshStatus, 500);
}

async function loadConfig() {
  let c = await api('/api/config');
  document.getElementById('cfg-mode').value = c.record_mode || 'absolute';
  document.getElementById('cfg-speed').value = String(c.default_speed || 1.0);
  document.getElementById('cfg-loops').value = Math.max(1, parseInt(c.default_loop_count) || 1);
  document.getElementById('cfg-infinite').checked = Boolean(c.infinite_loop);
  document.getElementById('cfg-loops').disabled = Boolean(c.infinite_loop);
  document.getElementById('cfg-hk-record').textContent = (c.hotkey_record || ['ctrl','shift','r']).map(s => s.charAt(0).toUpperCase()+s.slice(1)).join('+');
  document.getElementById('cfg-hk-play').textContent = (c.hotkey_play || ['ctrl','shift','p']).map(s => s.charAt(0).toUpperCase()+s.slice(1)).join('+');
}

function toggleInfiniteLoop() {
  document.getElementById('cfg-loops').disabled = document.getElementById('cfg-infinite').checked;
  saveConfig();
}

async function saveConfig() {
  await api('/api/config', 'POST', {
    record_mode: document.getElementById('cfg-mode').value,
    default_speed: parseFloat(document.getElementById('cfg-speed').value),
    default_loop_count: Math.max(1, parseInt(document.getElementById('cfg-loops').value) || 1),
    infinite_loop: document.getElementById('cfg-infinite').checked,
  });
}

refreshList();
loadConfig();
refreshStatus();
</script>
</body>
</html>
